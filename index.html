<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)">
<title>가계부</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{ --bg:#f5f2ec; --surface:#fffdf9; --ink:#1b1d22; --sub:#8a8579; --line:#ebe5da; --gold:#b08d57; --navy:#1d2533; --danger:#b4533e; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0f1012; --surface:#17181b; --ink:#ece8e1; --sub:#8f897e; --line:#25262a; --gold:#c9a66b; --navy:#ece8e1; } }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}

  /* 가계부 화면 */
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none;
    padding-top:env(safe-area-inset-top)}
  #loader{position:fixed;inset:0;display:none;place-items:center;background:var(--bg);z-index:2;transition:opacity .35s}
  #loader.hide{opacity:0;pointer-events:none}
  .logo{width:76px;height:76px;border-radius:20px;box-shadow:0 14px 30px -12px rgba(20,24,33,.5)}
  .ld{display:flex;flex-direction:column;align-items:center;gap:18px}
  .ld span{font-size:11px;letter-spacing:4px;color:var(--gold);font-weight:600}
  .bar{width:120px;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:var(--gold);border-radius:2px;animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
  .slow{font-size:12px;color:var(--sub);text-align:center;line-height:1.6;display:none;margin-top:4px}
  .slow button{margin-top:10px}

  /* 처음 설정 화면 */
  #setup{display:none;min-height:100%;padding:calc(48px + env(safe-area-inset-top)) 22px 40px;max-width:480px;margin:0 auto;overflow:auto;height:100%}
  #setup h1{font-size:26px;letter-spacing:-.8px;margin:22px 0 6px}
  #setup p{color:var(--sub);font-size:14px;line-height:1.65;margin:0}
  .step{background:var(--surface);border-radius:20px;padding:18px;margin-top:22px;box-shadow:0 10px 30px -14px rgba(60,48,28,.2)}
  .step b{font-size:13px;color:var(--gold);letter-spacing:.3px}
  textarea{width:100%;margin-top:10px;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid transparent;border-radius:14px;
    padding:13px 14px;min-height:110px;resize:none;outline:none;line-height:1.5;word-break:break-all}
  textarea:focus{border-color:var(--gold)}
  .err{color:var(--danger);font-size:13px;margin-top:8px;min-height:18px}
  .btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;font:inherit;font-weight:600;font-size:15px;cursor:pointer;background:var(--navy);color:var(--bg);margin-top:8px}
  .btn.ghost{background:var(--bg);color:var(--ink)}
  .note{font-size:12px;color:var(--sub);line-height:1.6;margin-top:18px}
</style>
</head>
<body>

<div id="loader"><div class="ld">
  <img class="logo" src="icon-192.png" alt="">
  <span>LEDGER</span>
  <div class="bar"><i></i></div>
  <div class="slow" id="slow">연결이 느려요. 인터넷 연결을 확인해 주세요.<br>
    <button class="btn ghost" style="width:auto;padding:10px 18px" onclick="location.reload()">다시 시도</button></div>
</div></div>

<iframe id="frame" title="가계부" allow="clipboard-read; clipboard-write"></iframe>

<section id="setup">
  <img class="logo" src="icon-192.png" alt="">
  <h1>가계부 연결하기</h1>
  <p>처음 한 번만 하면 됩니다. 주소는 <b>이 휴대폰에만</b> 저장되고 어디로도 보내지지 않아요.</p>
  <div class="step">
    <b>내 가계부 주소 붙여넣기</b>
    <textarea id="url" placeholder="https://script.google.com/macros/s/…/exec?token=…" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
    <div class="err" id="err"></div>
    <button class="btn ghost" onclick="pasteClip()">📋 클립보드에서 붙여넣기</button>
    <button class="btn" id="go" onclick="save()">연결하기</button>
  </div>
  <p class="note">· 주소는 <b>https://script.google.com/macros/s/</b>로 시작하고 <b>?token=</b>이 들어 있어야 해요.<br>
    · 주소를 바꾸려면 앱 주소 뒤에 <b>#reset</b>을 붙여 열면 이 화면이 다시 나와요.</p>
</section>

<script>
const KEY = 'gagyebu.url';
const $ = id => document.getElementById(id);
const store = {
  get(){ try { return localStorage.getItem(KEY) || ''; } catch(e){ return ''; } },
  set(v){ try { localStorage.setItem(KEY, v); return true; } catch(e){ return false; } },
  del(){ try { localStorage.removeItem(KEY); } catch(e){} }
};

// 긴 텍스트(카톡 말풍선 통째로 등)에서 올바른 주소만 뽑아냄
function extractUrl(text){
  const m = String(text||'').match(/https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_\-]+\/exec\?[^\s"'<>]*token=[A-Za-z0-9]+/);
  if(!m) return '';
  const u = new URL(m[0]);
  return `${u.origin}${u.pathname}?token=${u.searchParams.get('token')}`;
}

function showSetup(msg){
  $('frame').style.display='none'; $('loader').style.display='none';
  $('setup').style.display='block'; $('err').textContent = msg || '';
  document.body.style.overflow='auto';
}
function showApp(url){
  $('setup').style.display='none';
  $('loader').style.display='grid'; $('loader').classList.remove('hide');
  const f = $('frame'); f.style.display='block';
  const slowT = setTimeout(()=>{ $('slow').style.display='block'; }, 12000);
  f.onload = () => { clearTimeout(slowT); $('loader').classList.add('hide'); setTimeout(()=>{$('loader').style.display='none'}, 400); };
  f.src = url;
}
async function pasteClip(){
  try{ const t = await navigator.clipboard.readText(); $('url').value = t; $('err').textContent=''; }
  catch(e){ $('err').textContent = '칸을 길게 눌러 직접 붙여넣어 주세요.'; }
}
function save(){
  const u = extractUrl($('url').value);
  if(!u){ $('err').textContent = '올바른 가계부 주소를 찾지 못했어요. 주소를 다시 확인해 주세요.'; return; }
  if(!store.set(u)){ $('err').textContent = '이 브라우저에서는 저장이 안 돼요. 크롬에서 열어 주세요.'; return; }
  showApp(u);
}

function checkReset(){
  if(location.hash === '#reset'){ store.del(); history.replaceState(null,'',location.pathname); $('frame').src='about:blank'; showSetup(); return true; }
  return false;
}
window.addEventListener('hashchange', checkReset);
checkReset();
const saved = store.get();
saved ? showApp(saved) : showSetup();

if('serviceWorker' in navigator){ window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
</html>
